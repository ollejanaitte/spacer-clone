<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>下部工計画・3Dモデリングツール（プロトタイプ）</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #1a1a1a; color: #eee; }
      #sidebar { width: 330px; overflow-y: auto; background: #222; padding: 12px; border-right: 1px solid #333; }
      #viewport { flex: 1; position: relative; }
      h1 { font-size: 15px; }
      h2 { font-size: 13px; margin: 14px 0 6px; color: #9fb; }
      label { display: block; margin: 4px 0; font-size: 12px; }
      input { width: 100%; padding: 4px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 3px; }
      button { margin-top: 6px; padding: 6px 10px; background: #345; color: #eee; border: 1px solid #456; border-radius: 4px; cursor: pointer; }
      button.primary { background: #246; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .status { margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
      .info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px; font-size: 12px; z-index: 5; }
      #toolbar { margin-bottom: 8px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .err { color: #ff8080; }
      .ok { color: #80ff80; }
      .warn { color: #ffd280; }
      .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-right: 4px; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h1>下部工計画・3Dモデリングツール <span class="badge warn">未検証・実務使用不可</span></h1>
      <div id="toolbar">
        <button id="btnNew" class="primary">新規</button>
        <button id="btnSave">JSON保存</button>
        <button id="btnLoad">読込</button>
        <input type="file" id="fileInput" accept="application/json" style="display:none" />
        <button id="btnGlb">GLB出力</button>
      </div>
      <div class="grid" id="form"></div>
      <div class="status" id="status"></div>
    </div>
    <div id="viewport">
      <div class="info" id="info">クリックで部材ID表示</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
