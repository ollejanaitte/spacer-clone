name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Python venv (BridgeDefinition regression requires it)
        working-directory: .
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install fastapi "uvicorn[standard]" numpy scipy pydantic jsonschema httpx pytest
      - name: Install dependencies
        run: npm ci
      - name: Fast tests
        run: npm run test:fast
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
